version: '3.9'

services:

  web:
    build: .
    container_name: masika_backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: masika_postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: masika_wathu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

volumes:
  postgres_data: